[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auditchain"
version = "0.1.0"
description = "Append-only hash-chained audit log with verifiable pruning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "cryptography",
]

[project.optional-dependencies]
test = []

[tool.hatch.build.targets.wheel]
packages = ["auditchain"]
